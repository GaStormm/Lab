# ==============================================================================
# Preventive Maintenance & Baseline Playbook (site-maintenance.yml)
# Usage: ansible-playbook -i hosts.ini site-maintenance.yml
# ==============================================================================
---
- name: APT Package Updates and Baseline Verification across Debian LXCs and Ubuntu Server
  hosts: lxc_infra_vlan10:docker_servers_vlan20
  become: true
  tasks:
    - name: Update APT cache and apply security upgrades
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: dist
        autoremove: true
        autoclean: true

    - name: Ensure Zabbix Agent service is running and enabled on boot
      ansible.builtin.service:
        name: zabbix-agent
        state: started
        enabled: true
      ignore_errors: true

- name: Storage Service Health & Unused Docker Image Pruning on Homeserver (VLAN 20)
  hosts: docker_servers_vlan20
  become: true
  tasks:
    - name: Verify cross-VLAN storage daemons (NFS and Samba) are active
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - nfs-kernel-server
        - smbd

    - name: Prune dangling and unused Docker images older than 7 days to preserve 250 GB SSD
      ansible.builtin.command: docker image prune -af --filter "until=168h"
      changed_when: false
