# ==============================================================================
# Nginx Proxy Manager (NPM) - Managed VHosts Example (VLAN 20 -> Local & Cross-VLAN)
# Host: Homeserver (10.0.20.10) | Container: jc21/nginx-proxy-manager (Ports 80/443/81)
# PKI: Custom TLS certificates issued via Smallstep step-ca (*.ga.lab.arpa)
# ==============================================================================

# Global HTTP -> HTTPS redirect
server {
    listen 80 default_server;
    server_name *.ga.lab.arpa;
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------
# 1. Vaultwarden (Cross-VLAN Proxy: VLAN 20 [10.0.20.10] -> VLAN 10 [10.0.10.15:8080])
# Requires HTTPS to unlock WebCrypto API in Bitwarden clients
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name vault.ga.lab.arpa;

    ssl_certificate     /etc/letsencrypt/custom/ga.lab.arpa.crt;
    ssl_certificate_key /etc/letsencrypt/custom/ga.lab.arpa.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 128M;

    location / {
        proxy_pass http://10.0.10.15:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for real-time vault sync
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ------------------------------------------------------------------------------
# 2. Homarr v2 Dashboard (Local Upstream on Homeserver - Port 7576)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name homarr.ga.lab.arpa;

    ssl_certificate     /etc/letsencrypt/custom/ga.lab.arpa.crt;
    ssl_certificate_key /etc/letsencrypt/custom/ga.lab.arpa.key;

    location / {
        proxy_pass http://10.0.20.10:7576;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ------------------------------------------------------------------------------
# 3. Jellyfin Media Server (Local Upstream on Homeserver - Port 8097)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name jellyfin.ga.lab.arpa;

    ssl_certificate     /etc/letsencrypt/custom/ga.lab.arpa.crt;
    ssl_certificate_key /etc/letsencrypt/custom/ga.lab.arpa.key;

    # Disable buffering for smooth hardware-accelerated video streaming
    proxy_buffering off;

    location / {
        proxy_pass http://10.0.20.10:8097;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
