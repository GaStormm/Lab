name: homarr

services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:v2.0.0
    container_name: homarr-v2
    hostname: homarr
    restart: unless-stopped
    ports:
      - "7576:7575/tcp"
    environment:
      DB_DIALECT: sqlite
      DB_URL: /appdata/db/db.sqlite
      SECRET_ENCRYPTION_KEY: ${HOMARR_SECRET_ENCRYPTION_KEY}
      TZ: America/Sao_Paulo
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /DATA/AppData/homarr-v2/appdata:/appdata
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  default:
    name: homarr_default
