name: jellyfin

services:
  jellyfin:
    image: linuxserver/jellyfin:10.11.10
    container_name: jellyfin
    hostname: jellyfin
    restart: unless-stopped
    network_mode: bridge
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "8097:8096/tcp"
      - "8921:8920/tcp"
      - "7359:7359/tcp"
      - "1901:1900/tcp"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Sao_Paulo
    volumes:
      - /DATA/AppData/jellyfin/config:/config
      - /DATA/Media:/Media
    deploy:
      resources:
        limits:
          memory: 6G

networks:
  default:
    name: jellyfin_default
