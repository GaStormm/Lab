name: ollama

services:
  ollama:
    image: ollama/ollama:0.40.13
    container_name: big-bear-ollama-cpu
    hostname: ollama
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "11434:11434/tcp"
    environment:
      PORT: "11434"
      TZ: America/Sao_Paulo
    volumes:
      - /DATA/AppData/big-bear-ollama-cpu/.ollama:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 8G

networks:
  default:
    name: ollama_default
