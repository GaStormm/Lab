name: n8n

services:
  n8n:
    image: n8nio/n8n:2.29.2
    container_name: n8n
    hostname: n8n
    restart: unless-stopped
    depends_on:
      db-n8n:
        condition: service_healthy
        required: true
    ports:
      - "5678:5678/tcp"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db-n8n
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_SECURE_COOKIE: "false"
      TZ: America/Sao_Paulo
    volumes:
      - /DATA/AppData/big-bear-n8n/.n8n:/home/node/.n8n
    deploy:
      resources:
        limits:
          memory: 1G

  db-n8n:
    image: postgres:14.2
    container_name: db-n8n
    hostname: db-n8n
    restart: on-failure
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: ${N8N_DB_USER}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${N8N_DB_USER} -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - /DATA/AppData/big-bear-n8n/pgdata:/var/lib/postgresql/data
      - /DATA/AppData/big-bear-n8n/db/init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    deploy:
      resources:
        limits:
          memory: 1G

networks:
  default:
    name: n8n_default
