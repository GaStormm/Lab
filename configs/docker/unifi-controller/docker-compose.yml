name: unifi-controller

services:
  unifi-controller:
    image: jacobalberty/unifi:latest
    container_name: unifi-controller
    hostname: unifi-controller
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "8443:8443/tcp"
      - "8080:8080/tcp"
      - "3478:3478/udp"
      - "10001:10001/udp"
      - "1900:1900/udp"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Sao_Paulo
    volumes:
      - /DATA/AppData/unifi:/unifi
    deploy:
      resources:
        limits:
          memory: 2G

networks:
  default:
    name: unifi-controller_default
