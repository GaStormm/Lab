# ==============================================================================
# NFS and Samba Export Configuration on Homeserver (10.0.20.10 - 4 TB HDD)
# Hybrid Cross-VLAN Storage Architecture (VLAN 20 -> VLAN 10)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. /etc/exports (NFS Server for Immich LXC Photo Library)
# Restricted by IP exclusively to the Immich LXC container (10.0.10.17 in VLAN 10)
# ------------------------------------------------------------------------------
/mnt/hdd4tb/immich-fotos  10.0.10.17(rw,sync,no_subtree_check,no_root_squash)


# ------------------------------------------------------------------------------
# 2. /etc/samba/smb.conf (SMB/CIFS Share for Proxmox Saturn vzdump Backups)
# Restricted to the Saturn Hypervisor IP (10.0.10.10) with a dedicated user
# ------------------------------------------------------------------------------
[proxmox-backups]
   comment = Nightly vzdump Backup Repository (7-day Rolling Retention)
   path = /mnt/hdd4tb/proxmox-backups
   browseable = no
   read only = no
   guest ok = no
   valid users = proxmox_bkp
   hosts allow = 10.0.10.10
   create mask = 0640
   directory mask = 0750
