name: vaultwarden

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    env_file:
      - ./vaultwarden.env
    volumes:
      - ./data:/data
    ports:
      - "10.0.10.15:8080:80"
    security_opt:
      - no-new-privileges:true
